<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Catálogo</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="header">
        <h1>Mi Catálogo</h1>
    </header>

    <main class="catalogo" id="contenedor-productos">
    </main>

<script src="script.js"></script>

<div id="ver-carrito-btn" onclick="toggleCarrito()">
    🛒 <span id="contador-carrito">0</span>
</div>

<aside id="carrito-lateral" class="carrito-oculto">
    <div style="text-align: right;">
        <button onclick="toggleCarrito()" style="background:none; border:none; font-size: 2rem; cursor:pointer;">&times;</button>
    </div>
    <h2>Tu Carrito</h2>
    <div id="items-carrito">
        </div>
    <div class="total-carrito">
        Total: $<span id="precio-total">0.00</span>
    </div>
    
    <button class="btn-vaciar" onclick="vaciarCarrito()">Vaciar Carrito</button>
    <button class="btn-comprar" onclick="enviarPedido()">Finalizar Pedido</button>
</aside>


<main class="catalogo" id="contenedor-productos"></main>
<div id="notificacion" class="notificacion-oculta"></div>
</body>
</html>
